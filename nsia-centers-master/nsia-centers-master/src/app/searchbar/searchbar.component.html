<section class="ui-card search-panel" aria-label="جستجو و فلتر">
  <form (ngSubmit)="showDatePicker ? searchDates() : search()" novalidate>
    <div class="ui-fields search-fields">
      <div *ngIf="!showDatePicker" class="ui-field search-query"><label for="request-search">نام یا کود درخواستی</label><input id="request-search" class="form-control" type="search" [(ngModel)]="searchTerm" name="search" placeholder="نام یا کود را بنویسید"></div>
      <ng-container *ngIf="showDatePicker">
        <div class="ui-field"><label for="report-start">تاریخ شروع</label><div class="date-control"><input id="report-start" dir="ltr" [(ngModel)]="start_date" name="start" ngbDatepicker class="form-control" #startDate="ngbDatepicker" placeholder="سال-ماه-روز"><button type="button" (click)="startDate.toggle()" aria-label="انتخاب تاریخ شروع"><i class="far fa-calendar-alt" aria-hidden="true"></i></button></div></div>
        <div class="ui-field"><label for="report-end">تاریخ ختم</label><div class="date-control"><input id="report-end" dir="ltr" [(ngModel)]="end_date" name="end" ngbDatepicker class="form-control" #endDate="ngbDatepicker" placeholder="سال-ماه-روز"><button type="button" (click)="endDate.toggle()" aria-label="انتخاب تاریخ ختم"><i class="far fa-calendar-alt" aria-hidden="true"></i></button></div></div>
      </ng-container>
      <div class="ui-field" *ngIf="showStatusButton"><label id="status-filter-label">مرحلۀ رسیدگی</label><div ngbDropdown #statusMenu="ngbDropdown"><button class="ui-button ui-button-secondary status-selector" id="status-filter" ngbDropdownToggle type="button" aria-labelledby="status-filter-label status-filter">{{ selectedStatus?.description || 'تمام مراحل' }}</button><div ngbDropdownMenu aria-labelledby="status-filter"><button ngbDropdownItem type="button" *ngFor="let s of statusList" (click)="statusMenu.close();filterByStatus(s)">{{ s.description }}</button></div></div></div>
      <div class="ui-field" *ngIf="api.isAdmin() || api.isAudit()"><label id="center-filter-label">مرکز خدمات</label><select2 *ngIf="centers.length" [data]="centers" [value]="center_id && center_id !== 'false' ? '' + center_id : ''" [cssImport]="true" width="100%" (valueChanged)="filterByCenter($event)"></select2><div *ngIf="!centers.length" class="control-placeholder" aria-label="در حال دریافت مراکز"></div></div>
      <button type="submit" class="ui-button search-submit" [disabled]="api.processing"><i class="fas fa-search" aria-hidden="true"></i>{{ api.processing ? 'در حال دریافت…' : 'جستجو' }}</button>
    </div>
    <p *ngIf="dateError" class="ui-field-error" role="alert">{{ dateError }}</p>
  </form>
</section>
