<div class="row mb-5">
        <div class="col-md-8">
        
            <form *ngIf="!showDatePicker">
                <div class="row">
                    <div class="col-md-6">
                        <button class="btn btn-primary btn-block" (click)="showDatePicker=true" *ngIf="false">فلتر به اساس تاریخ</button>
                        <input class="form-control form-control-dark w-100" type="text" [(ngModel)]="searchTerm" name="search" placeholder="جستجو" aria-label="Search">
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-primary" (click)="search()">
                            جستجو <i class="fas fa-search"></i></button>
                    </div>
                </div>
              
            </form>
            <div class="row" *ngIf="showDatePicker">
                <div class="col-md-2">
                    <a href="#" class="btn btn-primary btn-block" (click)="showDatePicker=false" *ngIf="false">جستجو به اساس نام و کود</a>
                </div>
                <div class="col-md-4">
                   
                    تاریخ شروع
                    <input type="text"  [(ngModel)]="start_date" ngbDatepicker class="form-control" #startDate="ngbDatepicker"  (click)="startDate.open()"/>
                </div>
                <div class="col-md-4">
                    تاریخ ختم 
                    <input type="text" [(ngModel)]="end_date" ngbDatepicker class="form-control" #endDate="ngbDatepicker"  (click)="endDate.open()"/>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary btn-block mt-4" (click)="api.getApplications(start_date,end_date,reportType)">جستجو</button>
                 
                </div>
            </div>
        
        </div>


        <div class="col-md-4">
                
            <div ngbDropdown  *ngIf="showStatusButton" >
                <button [ngClass]="{'btn btn-outline-primary btn-block':true,'active':selectedStatus?.description}" id="dropdownBasic1" ngbDropdownToggle>
                    {{selectedStatus.description}}
                  
                </button>
                <div ngbDropdownMenu aria-labelledby="dropdownBasic1" >
                  <button ngbDropdownItem *ngFor="let s of statusList" (click)="filterByStatus(s)"> {{s?.description}}</button>
                
                </div>
            </div>

            <div ngbDropdown *ngIf="api.isAdmin() || api.isAudit()" class="mt-3">
                انتخاب مرکز
                <select2 [data]="centers" [cssImport]="true" width="100%" (valueChanged)="filterByCenter($event)"></select2>
            </div>
        </div>
        
    </div>
