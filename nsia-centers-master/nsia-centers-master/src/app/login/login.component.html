<div class="row bg mt-5" >
  <div class="col-md-4 offset-md-4">
    <div class="card overflow-hidden w-full max-w-xs">
      <div class="card-body" style="background-color:#11A89B;">
      <div class="p-6 pb-0">
        <div class="fill-current text-center">
          <img style="width:100%" src="assets/images/logo.png">
        </div>
      </div>
  
      <div class="text-center mt-4">
        <h2 class="title m-0">به سیستم خدمات اداره ملی احصایه و معلومات خوش آمدید</h2>
     
      </div>
  
      <form [formGroup]="form" class="p-6" (ngSubmit)="login()">
        <div >
          <div class="form-group">
            <label>E-Mail</label>
            <input formControlName="email" class="form-control" required>
            <div *ngIf="form.get('email').hasError('required')">We need an email address to log you in</div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" formControlName="password" class="form-control" required>
  
          </div>
        </div>
  
        <button class="btn btn-primary btn-block" type="submit">
          SIGN IN
        </button>
  
     
      </form>
    </div>
    </div>
  </div>
   
  </div>
