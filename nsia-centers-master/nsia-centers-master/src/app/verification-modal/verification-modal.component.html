<div class="ui-modal"><header class="modal-header"><div><p class="ui-eyebrow">بررسی اسناد</p><h2 class="modal-title" id="verification-title">ثبت تثبیت هویت</h2></div><button type="button" class="close" aria-label="بستن" [disabled]="submitting" (click)="ref.dismiss()"><span aria-hidden="true">&times;</span></button></header><form (ngSubmit)="updateVerification()"><div class="modal-body"><p class="ui-description">شمارهٔ درخواستی: <bdi dir="ltr">{{reference_no}}</bdi></p><div class="ui-tabs verification-options" role="group" aria-label="روش تثبیت هویت"><button type="button" [disabled]="submitting" [attr.aria-pressed]="isButtonSelected('system')" (click)="verifiedBySystem()"><i class="far fa-file-alt" aria-hidden="true"></i> سیستم <bdi>IVP</bdi></button><button type="button" [disabled]="submitting" [attr.aria-pressed]="isButtonSelected('phone')" (click)="verifiedByPhone()"><i class="fas fa-phone" aria-hidden="true"></i> تماس</button><button type="button" [disabled]="submitting" [attr.aria-pressed]="isButtonSelected('archive')" (click)="verifiedByArchive()"><i class="fas fa-book" aria-hidden="true"></i> آرشیف</button></div><div class="ui-field"><label for="verification-number">{{verification_type === 'system' ? 'شمارهٔ تثبیت هویت از سیستم IVP' : 'توضیحات تثبیت هویت'}}</label><input id="verification-number" name="verification_reference_no" class="form-control" [(ngModel)]="verification_reference_no" [disabled]="submitting" [attr.dir]="verification_type === 'system' ? 'ltr' : 'rtl'" autocomplete="off"><p class="ui-hint">معلومات را پیش از تأیید بررسی کنید.</p></div><div class="ui-alert" role="alert" *ngIf="errorMessage">{{errorMessage}}</div></div><footer class="modal-footer"><button type="submit" class="ui-button" [disabled]="submitting">{{submitting ? 'در حال ثبت…' : 'تأیید تثبیت هویت'}}</button><button type="button" class="ui-button ui-button-secondary" [disabled]="submitting" (click)="ref.dismiss()">انصراف</button></footer></form></div>
