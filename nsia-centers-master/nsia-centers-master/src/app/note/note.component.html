<section class="ui-card"><div class="ui-card-heading"><h2>یادداشت‌ها</h2><span class="ui-count">{{notes.length}} یادداشت</span></div><form (ngSubmit)="saveNote()"><div class="ui-field"><label for="application-note">یادداشت جدید</label><textarea id="application-note" class="form-control" name="note" [(ngModel)]="note" rows="3" placeholder="یادداشت مربوط به این درخواستی را بنویسید." [disabled]="saving"></textarea></div><div class="ui-actions"><button class="ui-button" type="submit" [disabled]="saving"><i class="far fa-save" aria-hidden="true"></i>{{saving ? 'در حال ثبت…' : 'ثبت یادداشت'}}</button><span class="ui-hint" role="status" *ngIf="saved">یادداشت ثبت شد.</span></div></form><div class="ui-alert" *ngIf="errorMessage" role="alert">{{errorMessage}}</div><app-page-skeleton *ngIf="loading" label="در حال دریافت یادداشت‌ها…"></app-page-skeleton><div class="ui-table-scroll notes-list" *ngIf="!loading && notes.length" tabindex="0" role="region" aria-label="یادداشت‌های درخواستی"><table class="ui-table"><thead><tr><th>تاریخ</th><th>یادداشت</th><th>کارمند</th></tr></thead><tbody><tr *ngFor="let n of notes"><td><bdi>{{n.created_on}}</bdi></td><td class="note-text">{{n.note}}</td><td>{{n.username}}</td></tr></tbody></table></div><p class="ui-empty" *ngIf="!loading && !errorMessage && !notes.length">برای این درخواستی یادداشتی ثبت نشده است.</p></section>
