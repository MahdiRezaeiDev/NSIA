<div class="row">
    <div class="col-md-9">
        <h3>یادداشت جدید</h3>
        <textarea [(ngModel)]="note" name="note" class="form-control" cols="4"></textarea>
        
    </div>
    <div class="col-md-3">
        <button (click)="saveNote()" class="btn btn-primary btn-block mt-5">ثبت</button>
    </div>
</div>
<div class="row">
    <div class="col-md-12 mt-5">
        
        <h3 class="mb-5">یادداشت ها</h3>
        <table class="table table-striped">
            <tbody>
            <tr>
                <td>تاریخ</td>
                <td width="50%"> یادداشت</td>
                <td>اسم کارمند</td>
            </tr>
            <tr *ngFor="let n of notes">
                <td>{{n.created_on}}</td>
                <td>{{n.note}}</td>
                <td>{{n.username}}</td>
            </tr>
        </tbody>
        </table>
    </div>
</div>
