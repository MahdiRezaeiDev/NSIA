<section class="document-viewer" [class.viewer-expanded]="expanded" aria-label="نمایش ضمایم"><div class="viewer-toolbar"><div class="viewer-tools" *ngIf="!isPdf"><button type="button" (click)="changeZoom(.25)" [disabled]="loading || failed || zoom >= 5" aria-label="بزرگ‌نمایی" title="بزرگ‌نمایی"><i class="fas fa-search-plus" aria-hidden="true"></i></button><button type="button" (click)="changeZoom(-.25)" [disabled]="loading || failed || zoom <= 1" aria-label="کوچک‌نمایی" title="کوچک‌نمایی"><i class="fas fa-search-minus" aria-hidden="true"></i></button><button type="button" (click)="rotate(90)" [disabled]="loading || failed" aria-label="چرخش به راست" title="چرخش به راست"><i class="fas fa-redo" aria-hidden="true"></i></button><button type="button" (click)="rotate(-90)" [disabled]="loading || failed" aria-label="چرخش به چپ" title="چرخش به چپ"><i class="fas fa-undo" aria-hidden="true"></i></button><button type="button" (click)="reset()" aria-label="اندازهٔ اصلی" title="اندازهٔ اصلی"><i class="fas fa-compress-arrows-alt" aria-hidden="true"></i></button></div><div class="viewer-tools"><button *ngIf="hasPdf" type="button" [attr.aria-pressed]="pdfOnly" (click)="filterPdf()" aria-label="نمایش فایل‌های پی‌دی‌اف" title="فایل‌های پی‌دی‌اف"><i class="far fa-file-pdf" aria-hidden="true"></i></button><button type="button" (click)="toggleExpanded()" [attr.aria-label]="expanded ? 'بستن نمای بزرگ' : 'نمای بزرگ'" [title]="expanded ? 'بستن نمای بزرگ' : 'نمای بزرگ'"><i class="fas" [class.fa-expand]="!expanded" [class.fa-times]="expanded" aria-hidden="true"></i></button></div></div><div class="viewer-viewport" #viewport tabindex="0" aria-label="تصویر ضمیمه؛ برای دیدن بخش‌های بزرگ‌شده اسکرول کنید"><div *ngIf="loading" class="image-loading" role="status"><span class="sr-only">در حال دریافت ضمیمه…</span><span></span><span></span><span></span></div><p class="viewer-error" role="alert" *ngIf="failed">نمایش این ضمیمه انجام نشد.</p><div class="image-sheet" *ngIf="source && !failed" [class.is-loading]="loading" [style.width.px]="sheetWidth" [style.height.px]="sheetHeight"><img [src]="source" [alt]="'ضمیمهٔ ' + (index + 1)" (load)="imageLoaded($event)" (error)="onError()" [style.width.px]="imageWidth" [style.height.px]="imageHeight" [class.turn-90]="rotation === 90" [class.turn-180]="rotation === 180" [class.turn-270]="rotation === 270"></div><iframe *ngIf="pdfSource && !failed" [src]="pdfSource" title="ضمیمهٔ پی‌دی‌اف" (load)="loading=false" (error)="onError()"></iframe></div><div class="viewer-footer"><button type="button" (click)="move(-1)" [disabled]="index === 0" aria-label="ضمیمهٔ قبلی"><i class="fas fa-chevron-right" aria-hidden="true"></i>قبلی</button><span role="status" aria-live="polite">{{index + 1}} از {{items.length}}</span><button type="button" (click)="move(1)" [disabled]="index >= items.length - 1" aria-label="ضمیمهٔ بعدی">بعدی<i class="fas fa-chevron-left" aria-hidden="true"></i></button></div></section>
