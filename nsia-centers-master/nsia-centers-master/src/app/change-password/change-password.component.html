<div class="row">
    <div class="col-md-6">
      <div class="card overflow-hidden w-full max-w-xs">
    
        <div class="text-center mt-4">
          <h2 class="title m-0">تغیر پاسورد</h2>
       
        </div>
    
        <form [formGroup]="form" class="p-6">
          <div >
           
            <div class="form-group">
              <label>پاسورد جدید</label>
              <input type="password" formControlName="password" class="form-control" required>
    
            </div>
          </div>
    
          <button (click)="changePassword()" class="btn btn-primary btn-block" type="button">
            تغیر
          </button>
    
       
        </form>
      </div>
    </div>
     
    </div>
