<div class="ui-page">
  <header class="ui-heading"><div><p class="ui-eyebrow">حساب کاربری</p><h1>تغییر رمز عبور</h1><p class="ui-description">برای حساب خود یک رمز عبور تازه تعیین کنید.</p></div></header>
  <section class="ui-card password-card">
    <span class="password-mark"><i class="fas fa-key" aria-hidden="true"></i></span><h2>رمز عبور تازه</h2><p class="ui-description">رمز عبور باید حداقل ۷ حرف داشته باشد.</p>
    <div *ngIf="errorMessage" class="ui-alert" role="alert">{{ errorMessage }}</div>
    <form [formGroup]="form" (ngSubmit)="changePassword()" novalidate>
      <div class="ui-field"><label for="new-password">رمز عبور</label><div class="password-control"><input id="new-password" [type]="visible ? 'text' : 'password'" formControlName="password" autocomplete="new-password" dir="ltr" class="form-control" [attr.aria-invalid]="submitted && form.invalid" aria-describedby="password-hint"><button type="button" (click)="visible = !visible" [attr.aria-label]="visible ? 'پنهان کردن رمز عبور' : 'نمایش رمز عبور'" [attr.aria-pressed]="visible"><i class="far" [class.fa-eye]="!visible" [class.fa-eye-slash]="visible" aria-hidden="true"></i></button></div><p id="password-hint" class="ui-field-error" *ngIf="submitted && form.invalid">رمز عبور با حداقل ۷ حرف وارد کنید.</p></div>
      <div class="ui-actions"><button type="submit" class="ui-button" [disabled]="saving">{{ saving ? 'در حال ثبت…' : 'ثبت رمز عبور' }}</button><a routerLink="/dashboard" class="ui-button ui-button-secondary">بازگشت</a></div>
      <span class="sr-only" role="status">{{ saving ? 'رمز عبور در حال ثبت است.' : '' }}</span>
    </form>
  </section>
</div>
