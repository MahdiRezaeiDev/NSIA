<nav class="applications-pagination" dir="rtl" aria-label="صفحه‌های نتایج" *ngIf="api.hasLoaded && api.lastPage > 1">
  <p role="status">نمایش {{firstRecord}} تا {{lastRecord}} از {{api.totalApplicationsCount}} ریکارد</p>
  <div class="page-controls">
    <button type="button" class="ui-button ui-button-secondary" (click)="changePage(api.currentPage - 1)" [disabled]="api.processing || api.currentPage === 1" aria-label="صفحهٔ قبلی">قبلی</button>
    <span>صفحهٔ {{api.currentPage}} از {{api.lastPage}}</span>
    <button type="button" class="ui-button ui-button-secondary" (click)="changePage(api.currentPage + 1)" [disabled]="api.processing || api.currentPage === api.lastPage" aria-label="صفحهٔ بعدی">بعدی</button>
  </div>
</nav>
