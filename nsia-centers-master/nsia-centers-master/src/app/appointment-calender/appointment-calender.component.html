<div class="appointment-heading"><i class="far fa-calendar-alt" aria-hidden="true"></i><div><h2>تاریخ مراجعه</h2><p>روز مورد نظر را انتخاب کنید.</p></div></div>
<app-page-skeleton *ngIf="processing"></app-page-skeleton>
<div *ngIf="errorMessage && !processing" class="ui-alert" role="alert"><p>{{ errorMessage }}</p><button type="button" class="ui-button ui-button-secondary" (click)="getDates()">کوشش دوباره</button></div>
<p *ngIf="!processing && !errorMessage && !dates.length" class="calendar-empty">تاریخی برای نمایش موجود نیست.</p>
<div *ngIf="!processing && !errorMessage" class="calendar-years">
  <section *ngFor="let year of dates" class="calendar-year">
    <button class="year-toggle" type="button" [attr.aria-expanded]="!!year.open" (click)="openYear(year.year)"><span>{{ year.year }}</span><i class="fas" [class.fa-chevron-down]="year.open" [class.fa-chevron-left]="!year.open" aria-hidden="true"></i></button>
    <div *ngIf="year.open" class="calendar-months"><section *ngFor="let month of year.months">
      <button type="button" class="month-toggle" [attr.aria-expanded]="!!month.open" (click)="openMonth(year.year,month.value)">{{ month.month }}<i class="fas" [class.fa-minus]="month.open" [class.fa-plus]="!month.open" aria-hidden="true"></i></button>
      <div *ngIf="month.open" class="calendar-days"><button type="button" *ngFor="let day of month.days" class="day-button" [class.day-selected]="day.value === selectedDate?.value" [attr.aria-pressed]="day.value === selectedDate?.value" (click)="selectDate(day)"><strong>{{ day.d }}</strong><span>{{ day.total_family }} فامیل</span><small>{{ day.total_individual }} نفر</small></button></div>
    </section></div>
  </section>
</div>
