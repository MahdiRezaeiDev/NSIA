<div class="workspace" [class.signed-in]="api.userDetails?.name" dir="rtl" lang="fa-AF">
  <a *ngIf="api.userDetails?.name" href="#workspace-content" class="skip-link">رفتن به محتوای صفحه</a>
  <aside *ngIf="api.userDetails?.name" class="sidebar" aria-label="منوی اصلی">
    <a class="sidebar-brand" [routerLink]="canManage ? '/admin-dashboard' : '/dashboard'" aria-label="صفحۀ اصلی مراکز">
      <img src="assets/images/logo.png" width="795" height="283" alt="ادارهٔ ملی احصائیه و معلومات">
      <span>سیستم مدیریت مراکز</span>
    </a>
    <div class="nav-caption">فضای کاری</div>
    <nav class="workspace-nav" aria-label="صفحات مراکز">
      <a *ngIf="canManage" routerLink="/admin-dashboard" routerLinkActive="nav-active"
         #overview="routerLinkActive" [attr.aria-current]="overview.isActive ? 'page' : null">
        <i class="fas fa-th-large" aria-hidden="true"></i><span>داشبورد</span>
      </a>
      <a routerLink="/dashboard" routerLinkActive="nav-active" #requests="routerLinkActive"
         [attr.aria-current]="requests.isActive ? 'page' : null">
        <i class="far fa-file-alt" aria-hidden="true"></i><span>درخواستی‌ها</span>
      </a>
      <a *ngIf="canManage" routerLink="/reports" routerLinkActive="nav-active"
         #reports="routerLinkActive" [attr.aria-current]="reports.isActive ? 'page' : null">
        <i class="fas fa-chart-bar" aria-hidden="true"></i><span>راپورها</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <span class="sidebar-footer-icon" aria-hidden="true"><i class="fas fa-fingerprint"></i></span>
      <div>خدمات تذکرهٔ الکترونیکی<small>ادارهٔ ملی احصائیه و معلومات</small></div>
    </div>
  </aside>

  <div class="workspace-body">
    <header *ngIf="api.userDetails?.name" class="workspace-header">
      <div class="header-location"><span>سیستم مراکز</span><i class="fas fa-angle-left" aria-hidden="true"></i><strong>{{ pageTitle }}</strong></div>
      <app-user-drop-down [user]="api.userDetails"></app-user-drop-down>
    </header>
    <main id="workspace-content" tabindex="-1" [class.workspace-main]="api.userDetails?.name" [class.guest-main]="!api.userDetails?.name">
      <router-outlet></router-outlet>
    </main>
  </div>
  <ngx-spinner></ngx-spinner>
</div>
